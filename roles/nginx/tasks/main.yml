---
- name: Install Nginx Web Server on Debian Family
  apt:
    name: nginx
    state: latest
    update_cache: yes
  when: ansible_os_family == "Debian"
  notify:
    - nginx systemd

- name: Replace nginx.conf from template
  template:
    src: templates/nginx.conf.j2
    dest: /etc/nginx/nginx.conf
  notify:
    - nginx restart
